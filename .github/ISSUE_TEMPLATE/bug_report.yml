name: Bug report
description: Something behaves wrong, crashes, or loses data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If it is a security problem — a mini-app reaching something it should
        not, or a key turning up somewhere — please do **not** file it here.
        See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export
      description: >
        In the app: Mehr → Diagnose → export, and paste it here. It carries the
        breadcrumbs from the last run and how it ended. It contains no keys and
        no conversation contents — but read it before pasting if you like.
      render: text

  - type: input
    id: version
    attributes:
      label: iOS version and device
      placeholder: iOS 26.4, iPhone 15 Pro

  - type: dropdown
    id: provider
    attributes:
      label: Which provider was in use
      options:
        - A cloud API key
        - My own server (Ollama / LM Studio / LocalAI / other)
        - On the device (MLX)
        - Several, or not sure
        - Not relevant to this bug
