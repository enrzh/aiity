name: iOS verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AIApp.xcodeproj \
            -scheme AIApp \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Build and test on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_MAJOR="$(xcodebuild -showsdks | sed -n 's/.*-sdk iphonesimulator\([0-9]*\).*/\1/p' | head -1)"
          SIMULATOR_ID="$(xcrun simctl list devices available --json | SDK_MAJOR="$SDK_MAJOR" python3 -c '
          import json, os, re, sys
          sdk = int(os.environ.get("SDK_MAJOR") or 0)
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              if sdk and version[0] > sdk:
                  continue
              for device in devices:
                  if "iPhone" in device["name"] and (best is None or version > best[0]):
                      best = (version, device["udid"])
          print(best[1] if best else "")
          ')"
          test -n "$SIMULATOR_ID"
          echo "Using iOS Simulator: $SIMULATOR_ID"
          xcodebuild test \
            -project AIApp.xcodeproj \
            -scheme AIApp \
            -destination "id=$SIMULATOR_ID" \
            -only-testing:AIAppTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee tests.log

          TEST_COUNT="$(grep -oE 'Executed [0-9]+ tests' tests.log | tail -1 | grep -oE '[0-9]+' || echo 0)"
          echo "Executed $TEST_COUNT tests"
          test "$TEST_COUNT" -ge 700
