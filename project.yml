name: AIApp
options:
  bundleIdPrefix: com.aiity
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.x switched to a macro-based HubClient API; 2.31.x is the stable
    # loadContainer(hub:configuration:) generation this code targets.
    exactVersion: 2.31.3
settings:
  base:
    # Extract localizable strings from source on every build. This is what
    # produces the CORRECT key for an interpolated string — Swift rewrites
    # "Mode: \(x)" to "Mode: %@", so a hand-written key silently never
    # matches and the string just falls back to German.
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  AIApp:
    type: application
    platform: iOS
    sources:
      - path: AIApp
        excludes:
          - Resources/**
      # Bundled SKILL.md packages, copied as a folder reference so the app
      # bundle contains BundledSkills/<name>.md — the exact layout
      # BundledSkills.markdown(named:) reads. NOTE: xcodegen has no target
      #-level `resources:` key; the previous one was silently ignored, so no
      # .md ever reached the bundle and every `bundled:` install quietly fell
      # back to its GitHub remoteSource.
      - path: AIApp/Resources/BundledSkills
        type: folder
        buildPhase: resources
    dependencies:
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon]
      - target: AIAppLiveActivity
    info:
      path: AIApp/Info.plist
      properties:
        CFBundleDisplayName: aiity
        # Version is single-sourced from the build settings below (it was once
        # hardcoded here and drifted from MARKETING_VERSION, which is rejected
        # on upload as ITMS-90473). App content is
        # German, so declare the dev region as such (was $(DEVELOPMENT_LANGUAGE)=en).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App Store Connect reads the TOP-LEVEL CFBundleIconName to show the
        # build icon in TestFlight/ASC. actool only injected the nested
        # CFBundleIcons variant into our xcodegen-owned Info.plist, so every
        # build up to 7 showed a blank icon in ASC (device home screen was
        # fine — that uses the nested key).
        CFBundleIconName: AppIcon
        # Mini-apps travel as .aiityapp files (JSON envelope) — declaring the
        # type is what makes Files/AirDrop route "Open with aiity".
        CFBundleDocumentTypes:
          - CFBundleTypeName: aiity Mini-App
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.aiity.miniapp
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.aiity.miniapp
            UTTypeDescription: aiity Mini-App
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - aiityapp
              public.mime-type:
                - application/json
        CFBundleDevelopmentRegion: de
        # Declared explicitly so iOS offers the app in these languages and the
        # App Store lists them. The actual strings live in
        # AIApp/Localizable.xcstrings; German is the source language,
        # so the German text IS the lookup key.
        CFBundleLocalizations:
          - de
          - en
          - es
          - fr
          - pt
          - it
          - zh-Hans
          - ja
          - ru
          - ar
          - hi
          - bn
          - ur
          - id
          - tr
          - vi
          - ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Live Activity for chat/build progress on Lock Screen + Dynamic Island.
        NSSupportsLiveActivities: true
        # CloudKit pushes a silent notification when another device changes a
        # record; without this background mode the store only syncs on launch.
        # `fetch` + `processing` are what BGTaskScheduler requires for
        # BGAppRefreshTask and BGProcessingTask respectively — they are ADDED
        # here, never replacing remote-notification (dropping it would stop
        # CloudKit from syncing between launches).
        UIBackgroundModes:
          - remote-notification
          - fetch
          - processing
        # Every identifier BGTaskScheduler is allowed to launch. An identifier
        # missing from this list makes register() return false and submit()
        # throw — both silently at runtime — so this must stay in lockstep with
        # BackgroundTaskID in AIApp/Services/BackgroundWork.swift (a unit test
        # asserts the two agree).
        BGTaskSchedulerPermittedIdentifiers:
          - com.aiity.app.refresh
          - com.aiity.app.maintenance
        # aiity is a bring-your-own-endpoint client: users point it at self-hosted
        # gateways — Ollama/LM Studio on the LAN, a sub2api gateway over Tailscale,
        # etc. — that often speak plain http. Tailscale IPs (100.64/10 CGNAT) aren't
        # covered by NSAllowsLocalNetworking, and iOS ATS won't honor exceptions for
        # raw IP literals, so we allow arbitrary loads to reach any user-configured
        # gateway. NOTE: NSAllowsArbitraryLoads must appear ALONE — if a more-specific
        # key like NSAllowsLocalNetworking is also present, iOS ignores arbitrary
        # loads and honors only the specific key (verified on iOS 26). Traffic to a
        # Tailscale peer is still WireGuard-encrypted; hosted providers stay https.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iOS 14+ gates connections to private-subnet hosts behind Local Network
        # privacy; without this key the first LAN gateway connection fails opaquely.
        NSLocalNetworkUsageDescription: Verbindung zu deinem lokalen Server (sub2api-Gateway, Ollama, LM Studio) im selben WLAN.
        NSCameraUsageDescription: Zum Scannen eines sub2api-Einrichtungscodes oder zum Aufnehmen von Fotos für einen Chat. Chat-Fotos werden nur an den von dir gewählten KI-Anbieter gesendet.
        # Diktat im Chat. Both strings must stay honest about the on-device
        # promise: the recognition request sets requiresOnDeviceRecognition and
        # there is deliberately NO server fallback, so no audio ever leaves the
        # phone — not to Apple, not to a model provider.
        NSMicrophoneUsageDescription: Zum Diktieren im Chat. Die Aufnahme wird ausschließlich auf deinem Gerät in Text umgewandelt und nie an einen Anbieter gesendet.
        # Agent-Werkzeuge (Mehr → Agent-Werkzeuge). Requested ONLY from a tap on
        # that screen — never at launch, never from a tool call, never from a
        # background task. The strings name the concrete capability, because
        # vague ones ("Zugriff auf deine Daten") are a review rejection.
        #
        # Both write-only and full-access keys are declared because the calendar
        # screen offers BOTH levels: "nur eintragen" calls
        # requestWriteOnlyAccessToEvents (the default, least-privilege path) and
        # only an explicit second tap asks for full access. iOS shows the key
        # matching the request it is answering, and a missing one crashes the
        # app at the moment of the request.
        NSRemindersFullAccessUsageDescription: Damit der Agent auf deine Bestätigung hin Erinnerungen anlegen und deine offenen Erinnerungen vorlesen kann. Jeder neue Eintrag wird dir vorher im Wortlaut gezeigt.
        NSCalendarsWriteOnlyAccessUsageDescription: Damit der Agent auf deine Bestätigung hin Termine eintragen kann. Bestehende Termine kann er damit nicht sehen.
        NSCalendarsFullAccessUsageDescription: Damit der Agent Termine eintragen und dir Fragen zu deinem Kalender beantworten kann. Gelesen werden Titel, Zeit, Kalendername und Ort der Termine im angefragten Zeitraum; diese Angaben gehen an den KI-Anbieter, den du selbst eingerichtet hast.
        NSSpeechRecognitionUsageDescription: Zum Diktieren im Chat. Die Spracherkennung läuft ausschließlich offline auf deinem Gerät; es werden keine Audiodaten an Apple oder einen KI-Anbieter übertragen.
        # OAuth callbacks: aiity:// primary; aiapp:// kept for OpenRouter redirect.
        CFBundleURLTypes:
          - CFBundleURLName: com.aiity.app
            CFBundleURLSchemes: [aiity, aiapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 20
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_ENTITLEMENTS: AIApp/AIApp.entitlements
        # Device install: Xcode auto-creates the profile once a team is picked.
        CODE_SIGN_STYLE: Automatic
        # Personal team (added here so `xcodegen generate` keeps device signing).
        DEVELOPMENT_TEAM: H8FW6W6K2D
  AIAppLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: AIAppLiveActivity
      - path: AIApp/Services/AgentActivityAttributes.swift
      # The Stop button's App Intent. Must be a member of BOTH targets: the
      # widget needs the type to build `Button(intent:)`, the app needs it in
      # its binary because LiveActivityIntent.perform() executes in the APP
      # process. Dropping it from either side breaks one half silently.
      - path: AIApp/Services/StopAgentRunIntent.swift
      # Shared pin store — the widget reads the pinned mini-app snapshot from
      # the App Group through it. (Its +App companion file is app-only.)
      - path: AIApp/Services/PinnedMiniAppStore.swift
    info:
      path: AIAppLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: aiity
        # Must match the containing app exactly or the upload is rejected as
        # ITMS-90473. Without these two lines XcodeGen writes its own defaults
        # (1.0 / 1) into this plist, which silently disagreed with the app's
        # MARKETING_VERSION — read them out of the BUILT .appex to check, not
        # out of project.yml.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.app.AgentActivity
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 20
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: H8FW6W6K2D
        SKIP_INSTALL: true
        CODE_SIGN_ENTITLEMENTS: AIAppLiveActivity/AIAppLiveActivity.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
  AIAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AIAppTests]
    dependencies:
      - target: AIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  AIAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AIAppUITests]
    dependencies:
      - target: AIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiity.app.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AIApp:
    build:
      targets:
        AIApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIAppTests
        - AIAppUITests
