name: AIApp
options:
  bundleIdPrefix: de.dongfang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 3.x switched to a macro-based HubClient API; 2.31.x is the stable
    # loadContainer(hub:configuration:) generation this code targets.
    exactVersion: 2.31.3
targets:
  AIApp:
    type: application
    platform: iOS
    sources: [AIApp]
    dependencies:
      - package: MLXSwiftLM
        products: [MLXLLM, MLXLMCommon]
    info:
      path: AIApp/Info.plist
      properties:
        CFBundleDisplayName: AI App
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Ollama/LM Studio on the user's own machine speak plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # OAuth (PKCE) callback, e.g. aiapp://oauth/openrouter
        CFBundleURLTypes:
          - CFBundleURLName: de.dongfang.aiapp
            CFBundleURLSchemes: [aiapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dongfang.aiapp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.0
        # Local models need more RAM than the default per-app limit.
        CODE_SIGN_ENTITLEMENTS: AIApp/AIApp.entitlements
  AIAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AIAppTests]
    dependencies:
      - target: AIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dongfang.aiapp.tests
        SWIFT_VERSION: "5.9"
  AIAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AIAppUITests]
    dependencies:
      - target: AIApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.dongfang.aiapp.uitests
        SWIFT_VERSION: "5.9"
schemes:
  AIApp:
    build:
      targets:
        AIApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIAppTests
        - AIAppUITests
